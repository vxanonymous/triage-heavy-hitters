_ > nanoagent.plugin.v0001.ManifestConfig:
id: triage-heavy-hitters
name: Triage Heavy Hitters
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  generate_traffic:
    description: Write a seeded web access log with one planted incident to <destination>/traffic-<seed>-<requests>.csv
  heavy_hitters:
    description: Find the values of one access log column that make up at least phi of the rows in a status class, with Misra-Gries counters

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  generate-traffic:
    description: Generate a seeded access log
    runner: tool
    tools: [generate_traffic]
    reference: null
    instructions: Write the access log for the seed and request count into the destination folder and return its path, size and SHA-256.
  find-heavy-hitters:
    description: Find the heavy hitters of an access log column
    runner: tool
    tools: [heavy_hitters]
    reference: null
    instructions: Count the column over the rows in the status class with ceil(1/epsilon) Misra-Gries counters and return every value whose estimate is at least (phi - epsilon) times the stream length.
  find-error-hotspot:
    description: Find the endpoint behind an incident's 5xx errors
    runner: agent
    tools: [generate_traffic, heavy_hitters]
    reference: null
    instructions: |-
      Generate the access log for the seed and request count with generate_traffic, destination traffic.
      Find the endpoint that served the most 5xx responses: call heavy_hitters on that file with field endpoint, status_class 5xx, phi 0.2 and epsilon 0.02, and take the hitter with the highest estimate.
      Decide whether that endpoint received at least 10% of all requests: call heavy_hitters on the same file with field endpoint, status_class any, phi 0.1 and epsilon 0.01. heavy_overall is true when the endpoint is listed there with an estimate of at least 0.1 times that call's stream_length, and false otherwise.
      Submit the file as generate_traffic returned it, the endpoint, error_requests as the 5xx call's stream_length, endpoint_errors_estimate as that endpoint's estimate in the 5xx call, and heavy_overall.
